# Run tests with PostgreSQL (no SQLite). Test DB is test_<DB_NAME>; prod is never touched.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: django_config.settings
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runs before Bazel: stdlib-only, ~1.5s, and it catches a class Bazel cannot.
      # An undeclared first-party import keeps working while some consumer's dep
      # closure happens to supply the module, so `bazel test //tests/...` stays
      # green through it — //tests:test_bazel_dep_check pins the checker's logic
      # against synthetic BUILD trees, never against this repo. This step is the
      # only thing that scans the real tree on a fresh clone; the pre-commit hook
      # that also runs it lives in .git/hooks/, which is not version-controlled.
      - name: Check Bazel deps declare every first-party import
        run: python3 tools/bazel_dep_check.py

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.1
        with:
          bazelisk-cache: true

      - name: Run tests
        run: |
          # CI uses postgres user (has CREATEDB). Tests create test_postgres and run there; real postgres DB is never written to.
          # Pass DB_* to tests so they use the service and create test_postgres.
          # BUILD_WORKSPACE_DIRECTORY so test_no_init_in_code_dirs can check the source tree.
          bazel test //tests/... --test_output=errors \
            --test_env=DB_NAME --test_env=DB_USER --test_env=DB_PASSWORD --test_env=DB_HOST --test_env=DB_PORT \
            --test_env=TEST_DB_USER --test_env=TEST_DB_PASSWORD \
            --test_env=BUILD_WORKSPACE_DIRECTORY=${{ github.workspace }}
