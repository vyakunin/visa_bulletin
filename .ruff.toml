# Ruff configuration for Python 3.11+ style enforcement
# See: https://docs.astral.sh/ruff/

# Python 3.11+ style enforcement
# UP007: Use X | None instead of Optional[X]
# UP006: Use list[X] instead of List[X]
# UP008: Use X | Y instead of Union[X, Y]
target-version = "py311"

[lint]
# Enable common rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modernizes Python syntax)
]

ignore = [
    "E501", # Line length (handled by formatter)
]

[lint.per-file-ignores]
# Generated migration code
"**/migrations/**" = ["E501", "F401", "N806"]
# Django scripts require django.setup() before model imports (E402)
"scripts/**" = ["E402"]
"tests/**" = ["E402"]
"check_migrations.py" = ["E402"]
"refresh_data_incremental.py" = ["E402"]
"django_config/settings.py" = ["E402"]
"webapp/views/prediction_views.py" = ["E402"]

[format]
# Use double quotes (consistent with existing codebase)
quote-style = "double"
line-ending = "auto"
