[project]
name = "visa-bulletin-daily-checkup"
version = "0.1.0"
description = "Daily checkup MCP server for visa-bulletin.us — health, traffic, security signals."
requires-python = ">=3.11"
dependencies = [
    # `daily_checkup_server.py` imports `mcp.server.fastmcp.FastMCP`, which exists
    # only on the 1.x line — mcp 2.0.0 removed it (the successor is
    # `mcp.server.mcpserver.MCPServer`, a different API). This bound is the ONE
    # owner of that constraint; the PEP-723 scripts under `scripts/` that import
    # this module restate it because inline metadata cannot import a shared value,
    # and //tests:test_mcp_pin_guard asserts they all still agree.
    "mcp>=1.0.0,<2",
    "httpx>=0.27",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]
