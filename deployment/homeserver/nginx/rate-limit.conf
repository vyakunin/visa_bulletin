# Rate limiting + log format for visa_bulletin homeserver stack.
# Loaded automatically from /etc/nginx/conf.d/ into the http {} block.
#
# Tuning rationale: home-server has 4 cores + 8 GB RAM (much more headroom than
# Lightsail 2 GB), so limits are 2-3x more generous than prod's. Still a real
# safety net against scrape attacks and runaway bots.

# === Log format with response time ===
# Used so we can grep slow requests (`awk '$NF > 1.0' access.log`).
log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent $request_time '
                      '"$http_referer" "$http_user_agent"';

# === IPv4 → /16 mapping (so one bot's whole crawler subnet shares one bucket) ===
map $remote_addr $remote_addr_slash16 {
    ~^(\d+\.\d+)\.\d+\.\d+$  $1.0.0;
    default                    $remote_addr;
}

# === Per-bot key (each bot's /16 gets its own bucket; non-bots fall through empty key) ===
map $http_user_agent $bot_key {
    default                       "";
    "~*GPTBot"                    $remote_addr_slash16;
    "~*OAI-SearchBot"             $remote_addr_slash16;
    "~*ChatGPT-User"              $remote_addr_slash16;
    "~*ClaudeBot"                 $remote_addr_slash16;
    "~*Claude-SearchBot"          $remote_addr_slash16;
    "~*anthropic-ai"              $remote_addr_slash16;
    "~*Googlebot"                 $remote_addr_slash16;
    "~*Bingbot"                   $remote_addr_slash16;
    "~*Applebot"                  $remote_addr_slash16;
    "~*Amzn-SearchBot"            $remote_addr_slash16;
    "~*AhrefsBot"                 $remote_addr_slash16;
    "~*PetalBot"                  $remote_addr_slash16;
    "~*SemrushBot"                $remote_addr_slash16;
    "~*Baiduspider"               $remote_addr_slash16;
    "~*YandexBot"                 $remote_addr_slash16;
    "~*DuckDuckBot"               $remote_addr_slash16;
    "~*MJ12bot"                   $remote_addr_slash16;
    "~*FacebookBot"               $remote_addr_slash16;
    "~*meta-externalagent"        $remote_addr_slash16;
    "~*Pinterestbot"              $remote_addr_slash16;
    "~*ia_archiver"               $remote_addr_slash16;
    "~*archive.org_bot"           $remote_addr_slash16;
    "~*linkedinbot"               $remote_addr_slash16;
    "~*Diffbot"                   $remote_addr_slash16;
    "~*ByteSpider"                $remote_addr_slash16;
    "~*ttspider"                  $remote_addr_slash16;
    "~*PerplexityBot"             $remote_addr_slash16;
    "~*perplexitybot"             $remote_addr_slash16;
    "~*BacklinksExtendedBot"      $remote_addr_slash16;
}

# === Combined "is this a bot" key (everything bot-ish goes into shared cap) ===
map $bot_key $allbots_key {
    default     $bot_key;
    ""          "";
}

# === Rate limit zones ===
# Per-bot per-/16: 30 r/min (4x prod's 7 r/min — homeserver has more headroom)
limit_req_zone $bot_key zone=bot_per_subnet:10m rate=30r/m;

# Combined cap across ALL bots: 60 r/min (4x prod's 15 r/min)
limit_req_zone $allbots_key zone=bot_total:10m rate=60r/m;

# Per-IP general limit: 200 r/min (2x prod's 100; covers humans + non-bot scripts)
limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;

# Stricter for sitemap/feed-style endpoints (heavy DB scans)
limit_req_zone $binary_remote_addr zone=heavy:10m rate=10r/m;

# === Log returned 429s separately for visibility (optional) ===
limit_req_status 429;
