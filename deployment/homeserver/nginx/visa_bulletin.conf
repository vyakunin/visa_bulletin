# nginx config for the homeserver visa_bulletin stack.
# TLS terminates at Cloudflare's edge — this nginx only listens on port 80
# inside the Docker network. cloudflared connects on container DNS name.

server {
    listen 80 default_server;
    server_name _;

    # Real-IP rewrite: trust the docker subnet where cloudflared lives so the
    # real_ip_module replaces $remote_addr with the actual client IP (from
    # CF-Connecting-IP, set by cloudflared). Without this, $remote_addr is
    # always 172.18.0.6 (cloudflared's docker IP), which breaks per-IP rate
    # limits and makes log-based traffic analysis useless. Added 2026-05-14.
    set_real_ip_from 172.18.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    access_log /var/log/nginx/access.log main_timed;

    # Basic security headers (applied to all responses below this server block).
    # CSP intentionally not set yet — needs per-page audit (Plotly inline scripts,
    # GoatCounter, etc.) before we can lock it down without breaking pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS: tells browsers to only use HTTPS for this domain for 6 months. CF
    # also adds this at the edge, but defense-in-depth.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    client_max_body_size 8m;
    keepalive_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static files served directly by nginx with long cache headers
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Health check / no-op
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Stricter limit for heavy scan endpoints
    location = /sitemap.xml {
        limit_req zone=heavy burst=2 nodelay;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything else → gunicorn (with 3-tier rate limit)
    location / {
        # Per-bot per-/16 (only fires for known bot UAs; empty key for humans)
        limit_req zone=bot_per_subnet burst=10 nodelay;
        # Shared cap across all bots
        limit_req zone=bot_total burst=20 nodelay;
        # Per-IP general (everyone)
        limit_req zone=general burst=40 nodelay;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
