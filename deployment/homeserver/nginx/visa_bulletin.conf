# nginx config for the homeserver visa_bulletin stack.
# TLS terminates at Cloudflare's edge — this nginx only listens on port 80
# inside the Docker network. cloudflared connects on container DNS name.

server {
    listen 80 default_server;
    server_name _;

    # Real-IP rewrite: trust the docker bridge subnets so real_ip_module
    # replaces $remote_addr with the actual client IP (from CF-Connecting-IP,
    # set by cloudflared). Without this, $remote_addr stays as the docker peer
    # IP, breaking per-IP rate limits AND log-based traffic analysis.
    # Trust 172.16.0.0/12 = all RFC1918 B-block private space, which covers
    # every docker bridge network on this host (172.17 default, 172.18 vb_*,
    # 172.19 vb_public/shared_cloudflared, etc.). Safe because nothing outside
    # the host's own containers can be the connecting peer with a 172.16-31.x
    # source IP. Originally narrower (172.18/16) — widened 2026-05-25 after
    # shared_cloudflared moved to 172.19/16 and silently broke the rewrite.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Canonicalize www -> non-www with a 301 (www was serving 200, splitting
    # signals; canonical tags covered it but a redirect is cleaner). Added
    # 2026-06-02. `return` inside `if` is the safe/blessed nginx exception.
    if ($host = "www.visa-bulletin.us") {
        return 301 https://visa-bulletin.us$request_uri;
    }

    access_log /var/log/nginx/access.log main_timed;

    # Basic security headers (applied to all responses below this server block).
    # CSP intentionally not set yet — needs per-page audit (Plotly inline scripts,
    # GoatCounter, etc.) before we can lock it down without breaking pages.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS: tells browsers to only use HTTPS for this domain for 6 months. CF
    # also adds this at the edge, but defense-in-depth.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    client_max_body_size 8m;
    keepalive_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static files served directly by nginx with long cache headers
    location ^~ /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Partner / media-kit page — standalone static HTML served directly
    # by nginx from the shared staticfiles volume. Added 2026-06-02.
    # Source file: monetization/partner.html in this repo, copied to
    # /opt/stack/visa_bulletin/staticfiles/partner.html on the homeserver
    # (owned by the container uid; needs sudo to replace). After editing this
    # conf you MUST `docker restart vb_nginx` (single-file mount inode gotcha).
    location = /partner {
        alias /usr/share/nginx/static/partner.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=300";
    }

    # Trailing-slash variant 301s to the canonical /partner (exact-match above
    # doesn't catch /partner/, which would otherwise fall through to Django →
    # 404). Added 2026-06-02 after /partner/ was reported returning Not Found.
    location = /partner/ {
        return 301 /partner;
    }

    # Health check / no-op
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Impact.com affiliate site-ownership verification (file-method fallback).
    # The "Impact-SiteVerifier" crawler probes this exact file. The meta-tag
    # method is handled separately by the sub_filter in `location /` below
    # (impact rotates the token; nginx swaps the live value so we never have to
    # re-render Django or fight its page cache). Added 2026-06-01.
    location = /impact3a3941dc-8be0-44bb-8cb8-743f8321a89c.html {
        access_log off;
        default_type text/html;
        return 200 "3a3941dc-8be0-44bb-8cb8-743f8321a89c";
    }

    # Stricter limit for heavy scan endpoints
    location = /sitemap.xml {
        limit_req zone=heavy burst=2 nodelay;
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything else → gunicorn (with 3-tier rate limit)
    location / {
        # Per-bot per-/16 (only fires for known bot UAs; empty key for humans)
        limit_req zone=bot_per_subnet burst=10 nodelay;
        # Shared cap across all bots
        limit_req zone=bot_total burst=20 nodelay;
        # Per-IP general (everyone)
        limit_req zone=general burst=40 nodelay;

        # Per-IP concurrent-connection cap (no human has 5 concurrent
        # dynamic page loads; caps a scraper from monopolizing the worker pool).
        limit_conn perip_conn 5;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Impact.com meta-tag site verification. Impact rotates the token; rather
        # than re-render Django + clear its page cache, we swap the live
        # impact-site-verification value at the edge. Accept-Encoding is cleared
        # toward gunicorn so sub_filter sees uncompressed HTML (nginx re-gzips to
        # the client via `gzip on`). Impact re-issues the token on each verify
        # attempt; swap target updated 2026-06-01: 796142d6 -> 4678a594 -> ac14b075.
        #
        # DEPLOY GOTCHA (learned 2026-06-01): this file is a SINGLE-FILE, READ-ONLY
        # docker bind mount (host -> /etc/nginx/conf.d/default.conf). Editing the
        # host file with `sed -i` (or any rename-based edit) creates a NEW inode;
        # the container stays bound to the OLD inode, so `nginx -s reload` keeps
        # serving the stale token even though `nginx -t` passes. You MUST
        # `docker restart vb_nginx` to re-resolve the mount (a reload is NOT enough).
        # Then purge CF (below) and wait ~30s for global purge propagation before
        # clicking "verify" in Impact, or the crawler hits a not-yet-purged PoP.
        # CF edge cache MUST be purged after any change here (cf-cache-status: HIT).
        proxy_set_header Accept-Encoding "";
        sub_filter '796142d6-3cf0-482a-92ee-485fc183ee2b' 'ac14b075-73ec-4185-ad19-6ef09fd0f079';
        sub_filter_once on;

        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
