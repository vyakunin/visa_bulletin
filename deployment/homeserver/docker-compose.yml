services:
  postgres:
    image: postgres:14
    container_name: vb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks: [vb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vb_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks: [vb]

  web:
    image: ghcr.io/vyakunin/visa_bulletin:${IMAGE_TAG:-latest}
    container_name: vb_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SETTINGS_MODULE: django_config.settings
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://redis:6379/1
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      ANALYTICS_SCRIPT: ${ANALYTICS_SCRIPT}
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./saved_pages:/app/saved_pages
      - ./logs:/app/logs
    networks: [vb]
    command: ["sh", "-c", "python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && exec gunicorn --workers ${WEB_CONCURRENCY:-3} --threads 2 --bind 0.0.0.0:8000 --timeout 60 --max-requests 1000 --max-requests-jitter 100 django_config.wsgi:application"]
    healthcheck:
      # User-Agent "HealthCheck/1.0" triggers cache_page_skip_bots so this probe
      # doesn't poison the page cache (see django_config/cache_utils.py).
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8000/', headers={'User-Agent': 'HealthCheck/1.0'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: vb_nginx
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./nginx/visa_bulletin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/rate-limit.conf:/etc/nginx/conf.d/00-rate-limit.conf:ro
      - ./staticfiles:/usr/share/nginx/static:ro
    ports:
      - "8080:80"   # LAN-side access for testing; cloudflared uses internal nginx:80
    networks: [vb, vb_public]

  # Cloudflare Tunnel connector lives in /opt/stack/_shared/docker-compose.yml
  # (shared_cloudflared). It reaches vb_nginx via the external vb_public network.

networks:
  vb:
    driver: bridge
  vb_public:
    external: true
