# =============================================================================
# PostgreSQL Configuration for 2GB Lightsail Instance
# Optimized for bulk ingest; parallel workers reduced to relieve memory pressure.
# Deploy: scp to /etc/postgresql/14/main/conf.d/custom.conf then restart postgresql.
# =============================================================================

# -----------------------------------------------------------------------------
# Memory Settings (tuned for 2GB RAM)
# -----------------------------------------------------------------------------
shared_buffers = 128MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 512MB

# -----------------------------------------------------------------------------
# Parallel Workers (reduced for 2GB instance)
# -----------------------------------------------------------------------------
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# -----------------------------------------------------------------------------
# Connection Limits
# -----------------------------------------------------------------------------
max_connections = 20

# -----------------------------------------------------------------------------
# Checkpoint Settings (spread I/O to avoid spikes)
# -----------------------------------------------------------------------------
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 1GB

# -----------------------------------------------------------------------------
# Background Writer (reduced activity)
# -----------------------------------------------------------------------------
bgwriter_delay = 500ms
bgwriter_lru_maxpages = 100

# -----------------------------------------------------------------------------
# Autovacuum (less aggressive during bulk operations)
# -----------------------------------------------------------------------------
autovacuum_max_workers = 1
autovacuum_naptime = 5min
autovacuum_vacuum_cost_delay = 20ms

# -----------------------------------------------------------------------------
# WAL Settings
# -----------------------------------------------------------------------------
wal_compression = on

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
