version: '3.8'

# Blue environment - runs on port 8000
# Used for blue-green zero-downtime deployments

services:
  redis:
    image: redis:7-alpine
    container_name: visa_bulletin_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Limit memory so Redis doesn't crash the instance; evict least-recently-used keys when full

  web-blue:
    image: ghcr.io/vyakunin/visa_bulletin:${IMAGE_TAG:-latest}
    container_name: visa_bulletin_web_blue
    ports:
      - "8000:8000"
    volumes:
      # PostgreSQL is used for database (no SQLite volume needed)
      - ./saved_pages:/app/saved_pages
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=django_config.settings
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - DB_HOST=host.docker.internal
      - ANALYTICS_SCRIPT=<script data-goatcounter="https://vyakunin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
      # ALLOWED_HOSTS from .env; default includes staging IP so external access works before .env is updated
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,54.196.241.197,44.209.204.255,visa-bulletin.us,www.visa-bulletin.us}
    env_file:
      - ../.env
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Memory limit: 200MB for web container (prevents OOM on 1GB instance)
    # System needs ~200MB, Nginx ~20MB, data-refresh ~50MB, leaving ~200MB for web
    mem_limit: 200m
    memswap_limit: 200m
    # Override CMD to use optimized gunicorn settings (2 workers, 60s timeout)
    # This allows updating without rebuilding Docker image
    # access-log-format: %(L)s = response time in decimal seconds (for slow-request analysis)
    command: sh -c "python3 manage.py migrate --noinput && gunicorn --workers 2 --threads 2 --bind 0.0.0.0:8000 --timeout 60 --max-requests 500 --max-requests-jitter 50 --access-logformat '%(h)s %(l)s %(u)s %(t)s \"%(r)s\" %(s)s %(b)s %(L)s' django_config.wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    
