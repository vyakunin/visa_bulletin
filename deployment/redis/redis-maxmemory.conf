# Redis memory limit for visa_bulletin cache (system Redis on prod).
# Prevents Redis from using unbounded RAM and crashing the instance.
# When maxmemory is reached, Redis evicts keys per maxmemory-policy.
#
# Apply on prod (systemd host with Redis on 127.0.0.1):
#   sudo cp deployment/redis/redis-maxmemory.conf /etc/redis/redis.conf.d/99-maxmemory.conf
#   sudo systemctl restart redis-server
# Or append to /etc/redis/redis.conf and restart.
#
# For 2GB instance: 256mb leaves room for app, PostgreSQL, system.
# allkeys-lru: evict least-recently-used keys (any key) when full.

maxmemory 256mb
maxmemory-policy allkeys-lru
