version: '3.8'

# Single app stack for instance-rotation deployment (one host = one stack on port 8000).
# Nginx proxies port 80 → 127.0.0.1:8000.

services:
  redis:
    image: redis:7-alpine
    container_name: visa_bulletin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    # Expose 6379 so pipeline warm_cache on host can use redis://127.0.0.1:6379/1

  web:
    image: ghcr.io/vyakunin/visa_bulletin:${IMAGE_TAG:-latest}
    container_name: visa_bulletin_web
    ports:
      - "8000:8000"
    volumes:
      - ./saved_pages:/app/saved_pages
      - ./logs:/app/logs
      # Allow host settings.py override so ALLOWED_HOSTS fix (refresh health check by IP) can be applied without image rebuild
      - ../django_config/settings.py:/app/django_config/settings.py:ro
    environment:
      - DJANGO_SETTINGS_MODULE=django_config.settings
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/1
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-3}
      - DB_HOST=host.docker.internal
      - ANALYTICS_SCRIPT=<script data-goatcounter="https://vyakunin.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,visa-bulletin.us,www.visa-bulletin.us}
    env_file:
      - ../.env
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: sh -c "python3 manage.py migrate --noinput && gunicorn --preload --workers $${WEB_CONCURRENCY:-3} --threads 2 --bind 0.0.0.0:8000 --timeout 60 --max-requests 1000 --max-requests-jitter 100 --access-logformat '%(h)s %(l)s %(u)s %(t)s \"%(r)s\" %(s)s %(b)s %(L)s' django_config.wsgi:application"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
