version: '3.8'

services:
  web:
    # Pull pre-built image from GitHub Container Registry
    # Override tag with: IMAGE_TAG=v1.2.3 docker-compose up
    image: ghcr.io/vyakunin/visa_bulletin:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      # Persist cached pages and logs (PostgreSQL is used for database)
      - ../data/bulletin/saved_pages:/app/saved_pages
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=django_config.settings
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    
  # Daily data refresh (cron-like service)
  data-refresh:
    # Use same image as web service
    image: ghcr.io/vyakunin/visa_bulletin:${IMAGE_TAG:-latest}
    command: sh -c "while true; do python3 scripts/ingest/run_pipeline.py discover-and-ingest --all-domains; sleep 86400; done"
    volumes:
      - ../data/bulletin/saved_pages:/app/saved_pages
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=django_config.settings
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - web

