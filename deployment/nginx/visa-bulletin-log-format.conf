# Response-time log format for Visa Bulletin
# Copy to /etc/nginx/conf.d/ so it loads in http {} (e.g. sudo cp /opt/visa_bulletin/deployment/nginx/visa-bulletin-log-format.conf /etc/nginx/conf.d/).
# visa-bulletin-locations.conf sets access_log ... main_timed for any server that includes it.

log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent $request_time '
                      '"$http_referer" "$http_user_agent"';
