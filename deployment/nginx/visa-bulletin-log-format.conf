# Response-time log format for Visa Bulletin
# Include this from http {} (e.g. copy to /etc/nginx/conf.d/ so it loads with other conf.d snippets).
# Then use access_log /var/log/nginx/access.log main_timed in the server block.

log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent $request_time '
                      '"$http_referer" "$http_user_agent"';
