# Default server so the app is reachable by IP (e.g. staging health check).
# Copied by orchestrator to /etc/nginx/sites-enabled/default-server.
# Do not use escaped $ — nginx must see $http_host, $remote_addr, etc.

server {
    listen 80 default_server;
    server_name _;

    location ^~ /static/ {
        alias /opt/visa_bulletin/webapp/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
