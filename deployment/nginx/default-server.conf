# Default server so the app is reachable by IP (e.g. staging health check).
# Installed by setup_new_instance.sh and by the orchestrator (services.py start_remote_services).
#
# NEVER create or edit this file via SSH heredoc/echo — shell escaping (\$host) causes nginx to
# send a literal backslash in the Host header, which Django rejects with DisallowedHost.
# Always deploy by copying from this repo file.
#
# Bots (GPTBot, ClaudeBot, …) connect to the raw IP over HTTP, bypassing DNS and the
# main visa-bulletin server block. Same limit_req / blacklist rules must apply here,
# or the rate limiter in gptbot-rate-limit.conf is worthless for IP-direct abusers.

server {
    listen 80 default_server;
    server_name _;

    location ^~ /static/ {
        alias /opt/visa_bulletin/webapp/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        if ($bot_blacklisted) { return 403; }

        limit_req zone=gptbot burst=1 nodelay;
        limit_req zone=allbots burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
