# Bot rate limiting: throttle to 15 req/min per /16 subnet.
# Keying by /16 subnet (not individual IP) ensures multiple IPs from the same
# crawler network (e.g. OpenAI's 74.7.0.0/16) share a single rate limit bucket.
# Safe: the subnet key is only assigned when the UA already matched a bot pattern,
# so legitimate users in the same /16 are never throttled.
#
# Include this in http {} (e.g. copy to /etc/nginx/conf.d/).
# Then in your server location / add: limit_req zone=gptbot burst=1 nodelay;

# Mask IPv4 to /16 for subnet-level rate limiting.
# IPv6 addresses fall through to $remote_addr (rare for crawlers).
map $remote_addr $remote_addr_slash16 {
    ~^(\d+\.\d+)\.\d+\.\d+$  $1.0.0;
    default                    $remote_addr;
}

map $http_user_agent $gptbot_key {
    default "";
    "~*GPTBot"              $remote_addr_slash16;
    "~*OAI-SearchBot"       $remote_addr_slash16;
    "~*ChatGPT-User"        $remote_addr_slash16;
    "~*Googlebot"           $remote_addr_slash16;
    "~*Bingbot"             $remote_addr_slash16;
    "~*DuckDuckBot"         $remote_addr_slash16;
    "~*Slurp"               $remote_addr_slash16;
    "~*Baiduspider"         $remote_addr_slash16;
    "~*YandexBot"           $remote_addr_slash16;
    "~*facebookexternalhit" $remote_addr_slash16;
    "~*meta-externalagent"  $remote_addr_slash16;
}

# When key is empty, requests are not rate-limited (per Nginx docs).
# Bot requests are limited to 15r/m per /16 subnet.
limit_req_zone $gptbot_key zone=gptbot:10m rate=15r/m;
