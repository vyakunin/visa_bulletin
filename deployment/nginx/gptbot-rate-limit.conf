# Bot rate limiting: allow but throttle to 0.15 qps per IP (9 req/min).
# Include this in http {} (e.g. copy to /etc/nginx/conf.d/).
# Then in your server location / add: limit_req zone=gptbot burst=1 nodelay;

map $http_user_agent $gptbot_key {
    default "";
    "~*GPTBot" $binary_remote_addr;
    "~*Googlebot" $binary_remote_addr;
    "~*Bingbot" $binary_remote_addr;
    "~*DuckDuckBot" $binary_remote_addr;
    "~*Slurp" $binary_remote_addr;
    "~*Baiduspider" $binary_remote_addr;
    "~*YandexBot" $binary_remote_addr;
    "~*facebookexternalhit" $binary_remote_addr;
}

# When key is empty, requests are not accounted (per Nginx docs).
# Bot requests are limited to 9r/m = 0.15 qps per IP.
limit_req_zone $gptbot_key zone=gptbot:10m rate=9r/m;
