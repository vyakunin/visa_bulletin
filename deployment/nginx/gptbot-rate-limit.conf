# Two-tier bot rate limiting:
#   1. Per-bot: 7 req/min per /16 subnet (prevents one bot from dominating)
#   2. Shared:  15 req/min total across ALL bots (caps combined bot load)
#
# Without the shared cap, N different bots × Nr/m = unbounded total bot load.
# On a 2GB Lightsail instance (20% baseline CPU), combined bot traffic from
# GPTBot + Googlebot + Applebot + Bingbot easily overwhelms the server
# even though each individually is rate-limited.
#
# Include this in http {} (e.g. copy to /etc/nginx/conf.d/).
# Then in your server location / add:
#   limit_req zone=gptbot burst=1 nodelay;
#   limit_req zone=allbots burst=5 nodelay;

# Mask IPv4 to /16 for subnet-level rate limiting.
# IPv6 addresses fall through to $remote_addr (rare for crawlers).
map $remote_addr $remote_addr_slash16 {
    ~^(\d+\.\d+)\.\d+\.\d+$  $1.0.0;
    default                    $remote_addr;
}

# Per-bot key: each bot's /16 subnet gets its own rate limit bucket.
map $http_user_agent $gptbot_key {
    default "";
    "~*GPTBot"                  $remote_addr_slash16;
    "~*OAI-SearchBot"           $remote_addr_slash16;
    "~*ChatGPT-User"            $remote_addr_slash16;
    "~*ClaudeBot"               $remote_addr_slash16;
    "~*Googlebot"               $remote_addr_slash16;
    "~*Bingbot"                 $remote_addr_slash16;
    "~*DuckDuckBot"             $remote_addr_slash16;
    "~*Slurp"                   $remote_addr_slash16;
    "~*Baiduspider"             $remote_addr_slash16;
    "~*facebookexternalhit"     $remote_addr_slash16;
    "~*meta-externalagent"      $remote_addr_slash16;
    "~*MJ12bot"                 $remote_addr_slash16;
    "~*PerplexityBot"           $remote_addr_slash16;
    "~*Applebot"                $remote_addr_slash16;
}

# Shared bot key: all bots share a single rate limit bucket ("allbots").
# When key is empty (human), no rate limit is applied.
map $http_user_agent $allbots_key {
    default "";
    "~*GPTBot"                  "allbots";
    "~*OAI-SearchBot"           "allbots";
    "~*ChatGPT-User"            "allbots";
    "~*ClaudeBot"               "allbots";
    "~*Googlebot"               "allbots";
    "~*Bingbot"                 "allbots";
    "~*DuckDuckBot"             "allbots";
    "~*Slurp"                   "allbots";
    "~*Baiduspider"             "allbots";
    "~*facebookexternalhit"     "allbots";
    "~*meta-externalagent"      "allbots";
    "~*MJ12bot"                 "allbots";
    "~*PerplexityBot"           "allbots";
    "~*Applebot"                "allbots";
}

# Blacklist: return 403 for these bots (checked in location / via if block).
# SEO scrapers with no search-engine value that generate heavy load.
# Amazonbot: aggressive crawler (~6.8k req/25h) with ~zero referral value for this site.
map $http_user_agent $bot_blacklisted {
    default 0;
    "~*YandexBot"               1;
    "~*SemrushBot"              1;
    "~*SERankingBacklinksBot"   1;
    "~*Amazonbot"               1;
}

# Per-bot: 7r/m per /16 subnet.
limit_req_zone $gptbot_key zone=gptbot:10m rate=7r/m;
# Shared: 15r/m total for all bots combined (single bucket).
limit_req_zone $allbots_key zone=allbots:1m rate=15r/m;
