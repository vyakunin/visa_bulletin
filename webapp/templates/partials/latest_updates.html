{% if latest_post %}
<div class="card shadow-sm border-0 bg-light mb-4">
    <div class="card-body d-flex align-items-center justify-content-between py-3">
        <div class="d-flex align-items-center">
            <div class="bg-primary bg-opacity-10 rounded-circle params-icon-large d-flex align-items-center justify-content-center me-3"
                style="width: 48px; height: 48px;">
                <i class="bi bi-newspaper text-primary fs-4"></i>
            </div>
            <div>
                <h6 class="mb-1 text-muted text-uppercase small fw-bold">Latest Analysis</h6>
                <a href="{% url 'blog_detail' latest_post.slug %}"
                    class="h6 mb-0 text-dark text-decoration-none stretched-link fw-bold">
                    {{ latest_post.title }}
                </a>
            </div>
        </div>
        <div class="d-none d-md-block text-end">
            <small class="text-muted d-block">{{ latest_post.published_date|date:"M d" }}</small>
            <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill">Analysis</span>
        </div>
    </div>
</div>
{% endif %}
